<style>
  :root { --brand:#000000; --brand2:#000000; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body {
    min-height:100vh; background:#f3f5fa; color:#111827;
    font-family:'Cairo',system-ui,Tahoma,Arial,sans-serif;
  }
  .hero {
    position:relative; height:250px; overflow:hidden;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);
    border-radius:0 0 50% 50% / 0 0 46px 46px;
  }
  .hero::before,.hero::after { content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.10); }
  .hero::before { width:280px; height:280px; top:-120px; left:-70px; }
  .hero::after  { width:200px; height:200px; bottom:-90px; right:-50px; background:rgba(255,255,255,.08); }
  .wrap { position:relative; max-width:460px; margin:-105px auto 0; padding:0 18px 36px; text-align:center; }
  .logo {
    width:132px; height:132px; margin:0 auto 14px; border-radius:50%;
    background:#fff; padding:6px; overflow:hidden;
    box-shadow:0 12px 30px rgba(16,24,40,.22), 0 0 0 4px rgba(255,255,255,.55);
    display:grid; place-items:center; animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .logo img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .logo b { font-size:3.2rem; font-weight:800; color:var(--brand); }
  h1 { margin:0; font-size:1.7rem; font-weight:800; letter-spacing:-.2px; animation:rise .6s .1s both; }
  .desc { margin:8px auto 0; max-width:340px; color:#6b7280; font-size:1rem; line-height:1.7; animation:rise .6s .15s both; }
  .bar { width:46px; height:4px; border-radius:4px; margin:16px auto 24px;
         background:linear-gradient(90deg,var(--brand),var(--brand2)); animation:rise .6s .2s both; }
  .link {
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:#fff; border:1px solid rgba(16,24,40,.05); border-radius:18px;
    padding:12px 14px; margin-bottom:12px; font-weight:700; font-size:1.08rem;
    box-shadow:0 4px 14px rgba(16,24,40,.06);
    transition:transform .2s ease, box-shadow .2s ease;
    animation:rise .55s both; animation-delay:var(--d);
  }
  .link:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(16,24,40,.12); }
  .link:active { transform:scale(.98); }
  .ic {
    width:48px; height:48px; flex:0 0 48px; border-radius:14px; background:var(--c); color:#fff;
    display:grid; place-items:center; font-size:1.35rem;
    box-shadow:0 6px 14px color-mix(in srgb, var(--c) 40%, transparent);
    transition:transform .2s ease;
  }
  .link:hover .ic { transform:scale(1.08) rotate(-4deg); }
  .tx { flex:1; text-align:right; }
  .arrow { color:#c2c8d3; font-size:.9rem; transition:transform .2s, color .2s; }
  .link:hover .arrow { transform:translateX(-4px); color:var(--brand); }
  footer { margin-top:26px; color:#9ca3af; font-size:.85rem; }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes pop  { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
